# Secret STUB. Do not apply this file as it stands and do not commit real values
# into it.
#
# Every value below is a placeholder. A Secret in Kubernetes is base64, which is
# an encoding and not encryption: anyone with `get secrets` in this namespace
# reads them in plaintext, and so does anyone who reads etcd. Use an external
# secret manager and one of the operators that projects from it — External
# Secrets Operator, the Secrets Store CSI driver, or Vault Agent Injector — and
# delete this file from the applied set.
#
# The four keys here are not equally sensitive and the differences matter.
#
# READ THIS BEFORE POPULATING ANYTHING: three of the four are read by NOTHING.
# deployment.yaml projects only ANTHROPIC_API_KEY into the container, because
# that is the only one any Go file in this repository looks up.
# TCRP_SIGNING_SECRET, TCRP_AUDIT_SIGNING_KEY and TCRP_DATABASE_URL describe
# where a real deployment would get those values; the code today hard-codes the
# first, generates the second per process, and has no database at all. They are
# kept as documentation of the shape, not as configuration. Filling them in
# changes nothing.
apiVersion: v1
kind: Secret
metadata:
  name: tcrp-secrets
  namespace: tcrp
  labels:
    app.kubernetes.io/name: tcrp
type: Opaque
stringData:

  # -------------------------------------------------------------------------
  # TCRP_SIGNING_SECRET — the identity signer's HMAC key. NOT READ TODAY.
  # -------------------------------------------------------------------------
  # identity.Signer mints and verifies the principal assertions carried in
  # X-TCRP-Principal. Whoever holds this key can assert ANY principal: the
  # treasurer, the risk manager, the agent. It is the single most sensitive
  # value in the platform, because four-eyes, scope checks and tier ceilings all
  # rest on the assertion being trustworthy.
  #
  # In this repository the value is the literal string "tcrp-dev-signing-key",
  # hard-coded in platform.New. That is fine for a demo and is not a credential.
  #
  # The platform and the standalone guardrail must hold the same value, because
  # the guardrail verifies the assertions the platform sends it.
  #
  # Rotation: dual-key verification (accept old and new, mint with new) is not
  # implemented. Rotating today means a brief window in which in-flight
  # assertions fail. The assertion TTL is 15 minutes, so a rotation is a
  # 15-minute degradation unless that is fixed first.
  TCRP_SIGNING_SECRET: "REPLACE_ME__at_least_32_bytes_of_csprng_output"

  # -------------------------------------------------------------------------
  # TCRP_AUDIT_SIGNING_KEY — the audit chain's ed25519 key. NOT READ TODAY.
  # -------------------------------------------------------------------------
  # audit.WithSigning signs every record. The chain already makes an edit
  # detectable; the signature is what makes an edit detectable BY SOMEBODY WHO
  # DOES NOT TRUST THE OPERATOR. That property only holds if this key lives
  # somewhere the operator cannot reach.
  #
  # In this repository the key is generated per process with ed25519.GenerateKey
  # in platform.New, which means records signed by one process cannot be verified
  # with another process's key. platform.New says so at the call site.
  #
  # This value should not be here at all. It should be a KMS or HSM key
  # reference, with the signing operation happening in the KMS and the private
  # key never materialising in the pod. The verification path does not change
  # either way — conform.VerifyBundle and audit.Verify take a public key.
  TCRP_AUDIT_SIGNING_KEY: "REPLACE_ME__ed25519_private_key__prefer_a_KMS_reference"

  # -------------------------------------------------------------------------
  # TCRP_DATABASE_URL — Postgres. NOT READ BY ANYTHING TODAY.
  # -------------------------------------------------------------------------
  # No Go file in this repository imports database/sql or opens a connection.
  # migrations/ holds a real schema and its constraints are worth reading; the
  # store the platform actually uses is on disk under --dir. When a
  # Postgres-backed store lands, this is the shape of its credential:
  # sslmode=require at minimum; verify-full where the CA is available. The role
  # this connects as must have INSERT and SELECT on audit_records and NOTHING
  # else — see the notes at the foot of migrations/0002_audit.sql — and must not
  # own the table.
  TCRP_DATABASE_URL: "postgres://tcrp_app:REPLACE_ME@postgres.tcrp.svc:5432/tcrp?sslmode=verify-full"

  # -------------------------------------------------------------------------
  # ANTHROPIC_API_KEY — only when `serve --model=anthropic`.
  # -------------------------------------------------------------------------
  # Omit the key entirely when running the deterministic planner, which is the
  # default and which sends nothing anywhere. agent.NewAnthropicModel returns an
  # error rather than falling back if it is unset, so a missing key is a startup
  # failure rather than a silent downgrade.
  #
  # This is the one credential that leaves the cluster, and
  # deploy/k8s/networkpolicy.yaml permits exactly one destination for it.
  ANTHROPIC_API_KEY: ""

# ---------------------------------------------------------------------------
# What is deliberately not here
# ---------------------------------------------------------------------------
#
# - The bridge signer keys. ADR 0008: the signers are in-process in this
#   repository and hold keys in memory. A real deployment runs them as separate
#   processes in separate failure domains with keys in separate HSMs — which
#   means their keys are not in this namespace at all, and the whole point is
#   that they are not in the same failure domain as anything here.
#
# - TLS material. Terminated at the ingress; the platform serves plaintext HTTP
#   inside the mesh.
#
# - No sealed-secrets, no SOPS, no age recipients. Deliberately none, rather
#   than one arbitrary choice presented as the answer.
