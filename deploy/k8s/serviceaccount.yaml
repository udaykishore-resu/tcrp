apiVersion: v1
kind: Namespace
metadata:
  name: tcrp
  labels:
    app.kubernetes.io/name: tcrp
    # Enforce the restricted Pod Security Standard at the namespace level, so a
    # workload that drops the securityContext in deployment.yaml is rejected by
    # the API server rather than silently running privileged.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcrp
  namespace: tcrp
  labels:
    app.kubernetes.io/name: tcrp
    app.kubernetes.io/component: platform
# The platform never calls the Kubernetes API. Mounting a token would hand a
# credential to a process that has no use for it, and the process runs an agent
# with money-movement tools — the last process in the cluster that should hold a
# usable API credential it does not need.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcrp-guard
  namespace: tcrp
  labels:
    app.kubernetes.io/name: tcrp
    app.kubernetes.io/component: guard
automountServiceAccountToken: false
# No Role and no RoleBinding for either account, deliberately. Neither workload
# reads or writes any Kubernetes resource. An empty Role would be more
# documentation than the absence of one; the absence is the statement.
